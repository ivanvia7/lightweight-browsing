<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lightweight Browsing</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --bg: #ffffff;
        --line: #e2e2e2;
        --accent: #3b7d4f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececec;
          --muted: #9a9a9a;
          --bg: #1e1e1e;
          --line: #343434;
          --accent: #6cc48a;
        }
      }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-of-type {
        border-top: 0;
      }
      .label {
        min-width: 0;
      }
      .label b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .label small {
        color: var(--muted);
      }
      .count {
        font-size: 20px;
        font-weight: 600;
        color: var(--accent);
      }
      /* Minimal switch built on a checkbox so keyboard access comes for free. */
      .switch {
        position: relative;
        flex: 0 0 auto;
        width: 38px;
        height: 22px;
      }
      .switch input {
        position: absolute;
        inset: 0;
        margin: 0;
        opacity: 0;
        cursor: pointer;
      }
      .switch span {
        position: absolute;
        inset: 0;
        border-radius: 11px;
        background: var(--line);
        transition: background 0.15s;
        pointer-events: none;
      }
      .switch span::after {
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.15s;
      }
      .switch input:checked + span {
        background: var(--accent);
      }
      .switch input:checked + span::after {
        transform: translateX(16px);
      }
      .switch input:focus-visible + span {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      a {
        color: var(--accent);
      }
      .off {
        opacity: 0.45;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>Lightweight Browsing</h1>

    <div class="row">
      <div class="label">
        <b>Blocking</b>
        <small id="globalState">on</small>
      </div>
      <label class="switch">
        <input type="checkbox" id="globalToggle" />
        <span></span>
      </label>
    </div>

    <div class="row" id="siteRow">
      <div class="label">
        <b id="hostname">—</b>
        <small>Disable on this site</small>
      </div>
      <label class="switch">
        <input type="checkbox" id="siteToggle" />
        <span></span>
      </label>
    </div>

    <div class="row">
      <div class="label">
        <b>Blocked on this tab</b>
        <small id="countNote">since last page load</small>
      </div>
      <div class="count" id="count">0</div>
    </div>

    <footer><a href="#" id="openOptions">Settings</a></footer>

    <script src="popup.js"></script>
  </body>
</html>
