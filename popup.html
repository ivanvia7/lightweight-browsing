<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lightweight Browsing</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.45 system-ui, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 14px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 9px 0;
        border-top: 1px solid var(--line);
      }
      .row:first-of-type {
        border-top: 0;
      }
      /* Lets the hostname ellipsis instead of pushing the switch off-screen. */
      .label {
        min-width: 0;
      }
      .label b {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .label small {
        color: var(--muted);
      }
      .count {
        font-size: 20px;
        font-weight: 600;
        color: var(--accent);
      }
      footer {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid var(--line);
      }
      a {
        color: var(--accent);
      }
      .off {
        opacity: 0.45;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <h1>Lightweight Browsing</h1>

    <div class="row">
      <div class="label">
        <b>Blocking</b>
        <small id="globalState">on</small>
      </div>
      <label class="switch">
        <input type="checkbox" id="globalToggle" />
        <span></span>
      </label>
    </div>

    <div class="row" id="siteRow">
      <div class="label">
        <b id="hostname">—</b>
        <small>Disable on this site</small>
      </div>
      <label class="switch">
        <input type="checkbox" id="siteToggle" />
        <span></span>
      </label>
    </div>

    <div class="row">
      <div class="label">
        <b>Blocked on this tab</b>
        <small>since last page load</small>
      </div>
      <div class="count" id="count">0</div>
    </div>

    <footer><a href="#" id="openOptions">Settings</a></footer>

    <script src="popup.js"></script>
  </body>
</html>
